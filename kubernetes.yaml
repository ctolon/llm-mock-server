apiVersion: v1
kind: Secret
metadata:
  name: openai-vllm-mock-secret
  labels:
    app: openai-vllm-mock
type: Opaque
stringData:
  MOCK_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openai-vllm-mock-config
  labels:
    app: openai-vllm-mock
data:
  PORT: "8000"
  MOCK_LATENCY_MS: "0"
  MOCK_STREAM_DELAY_MS: "0"
  MOCK_INCLUDE_REASONING: "true"
  MOCK_VLLM_VERSION: "0.32.0"
  MOCK_ENABLE_LOGGING: "true"
  MOCK_LOG_FORMAT: "json"
  MOCK_LOG_LEVEL: "INFO"
  MOCK_ENABLE_OBSERVABILITY: "true"
  MOCK_DETERMINISTIC: "false"
  MOCK_STATE_DB_PATH: ""
  MOCK_CORS_ORIGINS: "*"
  MOCK_ERROR_RATE: "0.0"
  MOCK_MAX_STORE_SIZE: "500"
  MOCK_MAX_STORE_BYTES: "16777216"
  MOCK_MAX_FILE_BYTES: "65536"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-vllm-mock
  labels:
    app: openai-vllm-mock
spec:
  # Default to 1 replica when MOCK_STATE_DB_PATH is empty to guarantee stateful CRUD consistency.
  # If scaling >1 replicas, mount a shared volume and set MOCK_STATE_DB_PATH="/data/mock_state.db".
  replicas: 1
  selector:
    matchLabels:
      app: openai-vllm-mock
  template:
    metadata:
      labels:
        app: openai-vllm-mock
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: openai-vllm-mock
          image: openai-vllm-mock:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openai-vllm-mock-config
            - secretRef:
                name: openai-vllm-mock-secret
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: state-dir
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: state-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openai-vllm-mock
  labels:
    app: openai-vllm-mock
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: openai-vllm-mock
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
